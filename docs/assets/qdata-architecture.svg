<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">QData free-source quant research database architecture</title>
  <desc id="desc">A layered architecture diagram from free-source adapters through ingestion, storage, governance, automation and research/API usage.</desc>
  <defs>
    <style>
      .bg { fill: #f6f7f4; }
      .band { fill: #ffffff; stroke: #d8dfda; stroke-width: 2; }
      .box { fill: #fbfcfa; stroke: #cdd7d1; stroke-width: 2; rx: 8; }
      .box-green { fill: #eaf3ed; stroke: #2e7d57; stroke-width: 2; rx: 8; }
      .box-teal { fill: #e7f2f3; stroke: #247a83; stroke-width: 2; rx: 8; }
      .box-gold { fill: #f7efe1; stroke: #b7791f; stroke-width: 2; rx: 8; }
      .title { fill: #17201d; font-family: Inter, Arial, sans-serif; font-size: 44px; font-weight: 800; }
      .subtitle { fill: #5c6862; font-family: Inter, Arial, sans-serif; font-size: 20px; font-weight: 500; }
      .label { fill: #17201d; font-family: Inter, Arial, sans-serif; font-size: 20px; font-weight: 760; }
      .small { fill: #5c6862; font-family: Inter, Arial, sans-serif; font-size: 15px; font-weight: 500; }
      .tiny { fill: #5c6862; font-family: Inter, Arial, sans-serif; font-size: 13px; font-weight: 650; }
      .arrow { stroke: #728078; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .pill { fill: #2e7d57; rx: 16; }
      .pill-text { fill: #ffffff; font-family: Inter, Arial, sans-serif; font-size: 13px; font-weight: 760; }
    </style>
    <marker id="arrowhead" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M 0 0 L 14 5 L 0 10 z" fill="#728078"/>
    </marker>
  </defs>

  <rect class="bg" width="1440" height="920"/>
  <text class="title" x="72" y="86">QData Free Source Quant Research Database</text>
  <text class="subtitle" x="72" y="124">Architecture for a zero-cost A-share quant research data project</text>

  <rect class="band" x="72" y="170" width="1296" height="120" rx="8"/>
  <text class="tiny" x="96" y="202">FREE / PUBLIC SOURCE LAYER</text>
  <rect class="box-green" x="96" y="220" width="190" height="46"/>
  <text class="label" x="120" y="249">AKShare</text>
  <rect class="box-green" x="310" y="220" width="190" height="46"/>
  <text class="label" x="334" y="249">BaoStock</text>
  <rect class="box-green" x="524" y="220" width="210" height="46"/>
  <text class="label" x="548" y="249">Tushare free</text>
  <rect class="box-green" x="758" y="220" width="230" height="46"/>
  <text class="label" x="782" y="249">Official public</text>
  <rect class="box-green" x="1012" y="220" width="320" height="46"/>
  <text class="label" x="1036" y="249">Local CSV fixtures</text>

  <path class="arrow" d="M 720 292 V 344"/>

  <rect class="band" x="72" y="344" width="1296" height="142" rx="8"/>
  <text class="tiny" x="96" y="376">INGESTION AND NORMALIZATION</text>
  <rect class="box" x="96" y="394" width="280" height="68"/>
  <text class="label" x="120" y="422">Provider adapters</text>
  <text class="small" x="120" y="446">symbol mapping, timeout guards</text>
  <rect class="box" x="416" y="394" width="280" height="68"/>
  <text class="label" x="440" y="422">Dataset models</text>
  <text class="small" x="440" y="446">daily bars, calendars, PIT data</text>
  <rect class="box" x="736" y="394" width="280" height="68"/>
  <text class="label" x="760" y="422">Quality checks</text>
  <text class="small" x="760" y="446">coverage, conflict, freshness</text>
  <rect class="box" x="1056" y="394" width="276" height="68"/>
  <text class="label" x="1080" y="422">Raw snapshots</text>
  <text class="small" x="1080" y="446">audit-friendly source evidence</text>

  <path class="arrow" d="M 720 488 V 540"/>

  <rect class="band" x="72" y="540" width="1296" height="142" rx="8"/>
  <text class="tiny" x="96" y="572">STORAGE AND GOVERNANCE</text>
  <rect class="box-teal" x="96" y="590" width="280" height="68"/>
  <text class="label" x="120" y="618">PostgreSQL metadata</text>
  <text class="small" x="120" y="642">versions, PIT, audit, schedules</text>
  <rect class="box-teal" x="416" y="590" width="280" height="68"/>
  <text class="label" x="440" y="618">ClickHouse series</text>
  <text class="small" x="440" y="642">market bars and factor values</text>
  <rect class="box-gold" x="736" y="590" width="280" height="68"/>
  <text class="label" x="760" y="618">Source governance</text>
  <text class="small" x="760" y="642">reliability, admission, recovery</text>
  <rect class="box-gold" x="1056" y="590" width="276" height="68"/>
  <text class="label" x="1080" y="618">Worker automation</text>
  <text class="small" x="1080" y="642">Mu scheduler, Lambda worker</text>

  <path class="arrow" d="M 720 684 V 736"/>

  <rect class="band" x="72" y="736" width="1296" height="112" rx="8"/>
  <text class="tiny" x="96" y="768">RESEARCH AND PORTFOLIO SURFACES</text>
  <rect class="box" x="96" y="786" width="250" height="42"/>
  <text class="label" x="120" y="813">Python SDK</text>
  <rect class="box" x="382" y="786" width="250" height="42"/>
  <text class="label" x="406" y="813">REST API</text>
  <rect class="box" x="668" y="786" width="250" height="42"/>
  <text class="label" x="692" y="813">Admin console</text>
  <rect class="box" x="954" y="786" width="378" height="42"/>
  <text class="label" x="978" y="813">Factor demo and notebooks</text>

  <rect class="pill" x="72" y="872" width="162" height="30"/>
  <text class="pill-text" x="94" y="892">291 tests passing</text>
  <rect class="pill" x="254" y="872" width="200" height="30"/>
  <text class="pill-text" x="276" y="892">73 console smoke markers</text>
  <rect class="pill" x="474" y="872" width="176" height="30"/>
  <text class="pill-text" x="496" y="892">0 RMB research route</text>
</svg>
